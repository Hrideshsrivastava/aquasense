# Builds the AquaSense Android app (technician + customer) as an installable APK.
# Download it from the run's "Artifacts", or from the "android-latest" release.
name: Android APK

on:
  push:
    branches: [main, claude/gracious-albattani-8eqoid]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: mobile/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../AquaSense.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AquaSense-android-apk
          path: mobile/AquaSense.apk

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --prerelease --title "AquaSense Android (latest build)" \
              --notes "Latest AquaSense app (technician + customer). Install AquaSense.apk on Android 8+; allow installs from this source."
          gh release upload android-latest AquaSense.apk --clobber
